<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>keysim · 手键/电子键虚拟串口台</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e;
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --accent:#58a6ff; --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err)}
  .dot.on{background:var(--ok)}
  main{display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,1fr);gap:16px;padding:16px;align-items:start}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  section h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  label{color:var(--muted);font-size:12px;min-width:64px}
  input,select,textarea,button{background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  input[type=number]{width:96px;font-family:var(--mono)}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent)}
  textarea{width:100%;min-height:92px;font-family:var(--mono);letter-spacing:1px;resize:vertical}
  button{cursor:pointer;border-color:#3d444d}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1f6feb22;border-color:#1f6feb;color:#cfe4ff}
  button.danger{border-color:#8b2d24;color:#ffb3ab}
  .grow{flex:1}
  .hint{color:var(--muted);font-size:12px;margin:6px 0 0;font-family:var(--mono);word-break:break-all}
  .bar{height:6px;background:#0d1117;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
  #log{height:280px;overflow:auto;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12px}
  #log div{white-space:pre-wrap;word-break:break-all;padding:1px 0}
  .l-ok{color:var(--ok)} .l-warn{color:var(--warn)} .l-error{color:var(--err)} .l-recv{color:var(--accent)} .l-info{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  td{padding:3px 0;color:var(--muted)} td+td{color:var(--text);text-align:right}
  .hidden{display:none !important}
  .t-warn,td+td.t-warn{color:var(--warn)}
  .t-ok,td+td.t-ok{color:var(--ok)}
  .chip.t-warn{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>keysim</h1>
  <span class="sub">手键 / 电子键拍发模拟器 · 虚拟串口台</span>
  <span class="chip"><i class="dot" id="portDot"></i><span id="portText">串口未开启</span></span>
  <span class="chip" id="kernelChip"><i class="dot" id="kernelDot"></i><span id="kernelChipText">内核级未启用</span></span>
  <span class="chip">桌面桥接 <b id="bridgeClients">0</b></span>
  <span class="chip">浏览器注入 <b id="injectClients">0</b></span>
</header>

<main>
  <section>
    <h2>虚拟串口</h2>
    <div class="row">
      <button id="btnOpen" class="primary">开启虚拟串口</button>
      <button id="btnClose" class="danger">关闭虚拟串口</button>
    </div>
    <table style="margin-bottom:8px">
      <tr><td>⓿ 内核级虚拟串口</td><td id="kernelSelectable">--</td></tr>
      <tr id="rowKernelAlias"><td>桌面壳串口下拉</td><td id="kernelAlias">--</td></tr>
      <tr><td>① PTY 设备</td><td id="devPath">--</td></tr>
      <tr><td>② 桌面桥接</td><td id="bridgeUrl">--</td></tr>
      <tr><td>③ 浏览器注入</td><td id="injectCount">0 个页面</td></tr>
    </table>
    <p class="hint t-warn hidden" id="actionHint">--</p>
    <div class="row" id="rowHelper">
      <button id="btnInstallHelper">安装 root 助手（一次）</button>
      <span class="hint" id="helperState">--</span>
    </div>
    <div class="row" id="rowLink">
      <button id="btnLink">接入系统串口列表</button>
      <button id="btnUnlink">移出列表</button>
      <span class="hint" id="linkState">--</span>
    </div>
    <details class="more">
      <summary>四条通道怎么选</summary>
      <p class="hint" id="channelDoc">--</p>
    </details>

    <h2 style="margin-top:18px">被测页面</h2>
    <div class="row">
      <input id="targetUrl" class="grow" placeholder="http://127.0.0.1:8080/#/preview/... 训练页地址"/>
    </div>
    <div class="row">
      <button id="btnOpenPage" class="primary">打开并预置虚拟串口</button>
      <button id="btnClosePage">关闭页面</button>
      <span class="hint" id="pageState">未打开</span>
    </div>
    <p class="hint" id="pageHint">--</p>
    <details class="more" id="rowManualInject">
      <summary>手动注入代码（用你自己那个已登录的浏览器时才需要）</summary>
      <div class="row">
        <input id="injectSnippet" class="grow" readonly/>
        <button id="btnCopy">复制</button>
      </div>
    </details>

    <h2 style="margin-top:18px">报文</h2>
    <div class="row">
      <label>字母表</label>
      <select id="alphabet">
        <option value="letter">字码 letter（A-Z）</option>
        <option value="short">数码短码 short（0-9）</option>
        <option value="long">数码长码 long（0-9）</option>
        <option value="mix">混合 mix（A-Z 0-9）</option>
      </select>
      <label>组数</label>
      <input id="groups" type="number" min="1" max="100" value="4"/>
      <button id="btnRandom">随机生成</button>
    </div>
    <textarea id="message" spellcheck="false" placeholder="手输或随机生成；每组 4 个字符，组间空格分隔，例如 ABCD EFGH"></textarea>
  </section>

  <section>
    <h2>拍发参数</h2>
    <div class="row">
      <label>键型</label>
      <select id="key">
        <option value="hand">手键（按压时长定点划）</option>
        <option value="electron">电子键（双手组合键）</option>
      </select>
      <label id="rateLabel">码率</label>
      <input id="rate" type="number" min="1" max="400" value="70"/>
      <span class="hint" id="rateUnit">字符/分</span>
    </div>
    <div class="row">
      <label>抖动</label>
      <input id="jitter" type="number" min="0" max="0.5" step="0.05" value="0"/>
      <label>种子</label>
      <input id="seed" type="number" min="1" value="1"/>
      <label>规则偏移</label>
      <input id="skew" type="number" min="1" max="99" value="51"/>
    </div>
    <div class="row">
      <label>收尾</label>
      <select id="tail">
        <option value="turn">手键翻页符（提交本页）</option>
        <option value="end">结束符 / F3+回车</option>
        <option value="page">电子键句号（提交本页）</option>
        <option value="none">只留静默</option>
      </select>
      <label style="min-width:auto"><input type="checkbox" id="preamble" checked/> 发开始符</label>
      <label style="min-width:auto"><input type="checkbox" id="singlePage" checked/> 单页</label>
    </div>
    <div class="row">
      <label>故障</label>
      <label style="min-width:auto"><input type="checkbox" class="fault" value="dupDown"/> 重复按下</label>
      <label style="min-width:auto"><input type="checkbox" class="fault" value="missingUp"/> 缺抬起</label>
      <label style="min-width:auto"><input type="checkbox" class="fault" value="microPress"/> ≤10ms 抖动</label>
      <label style="min-width:auto"><input type="checkbox" class="fault" value="unknownByte"/> 未知字节</label>
    </div>
    <div class="row">
      <button id="btnPreview">预览节拍</button>
      <button id="btnSend" class="primary">开始拍发</button>
      <button id="btnStop" class="danger">停止</button>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <table id="stats">
      <tr><td>时长</td><td id="stDuration">--</td></tr>
      <tr><td>帧数</td><td id="stEvents">--</td></tr>
      <tr><td>点 / 划 / 符内间隔</td><td id="stPlan">--</td></tr>
      <tr><td>字间隔 / 组间隔</td><td id="stGap">--</td></tr>
    </table>
  </section>

  <section style="grid-column:1/-1">
    <h2>日志</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id)
// GET 只有 /api/state；其余接口一律 POST，所以默认带一个空 body 走 POST。
const api = async (path, body = {}, method = 'POST') => {
  const response = await fetch(path, method === 'GET' ? {} : {
    method, headers: {'content-type': 'application/json'}, body: JSON.stringify(body)
  })
  return response.json()
}
const log = (message, level = 'info') => {
  const line = document.createElement('div')
  line.className = 'l-' + level
  line.textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false}) + ' ' + message
  $('log').append(line)
  $('log').scrollTop = $('log').scrollHeight
}
const faults = () => [...document.querySelectorAll('.fault:checked')].map(box => box.value)
const params = () => ({
  key: $('key').value,
  text: $('message').value.trim(),
  alphabet: $('alphabet').value,
  rate: Number($('rate').value),
  jitter: Number($('jitter').value),
  seed: Number($('seed').value),
  skew: Number($('skew').value),
  preamble: $('preamble').checked,
  singlePage: $('singlePage').checked,
  tail: $('tail').value,
  faults: faults()
})

// ==== state-render:begin ====
// 所有 DOM 写入都走这三个小工具：单点兜底，字段缺失 / 为 null 时统一显示 --，不会漏出 undefined。
const setText = (id, value, tone) => {
  const node = $(id)
  if (!node) return
  node.textContent = (value === undefined || value === null || value === '') ? '--' : String(value)
  node.classList.toggle('t-warn', tone === 'warn')
  node.classList.toggle('t-ok', tone === 'ok')
}
const setShown = (id, shown) => {
  const node = $(id)
  if (node) node.classList.toggle('hidden', !shown)
}
const setDisabled = (id, disabled) => {
  const node = $(id)
  if (node) node.disabled = !!disabled
}

const applyState = raw => {
  const state = raw || {}
  const kernel = state.kernel || {}
  const device = state.device || {}
  const helper = state.helper || {}
  const browser = state.browser || {}
  const replay = state.replay || {}
  const windows = state.platform === 'windows'
  const open = state.open === true
  const running = replay.running === true
  const bridgeClients = Number(state.bridgeClients) || 0
  const injectClients = Number(state.injectClients) || 0
  const helperCommand = helper.command || 'sudo keysim install-helper'

  // 顶部状态区
  $('portDot').classList.toggle('on', open)
  setText('portText', open ? ('串口已开启 :' + (state.bridgePort || '--')) : '串口未开启')
  setText('bridgeClients', bridgeClients)
  setText('injectClients', injectClients)

  // ⓿ 内核级：唯一能被浏览器串口选择框看到的通道
  const selectable = kernel.selectable || ''
  const openable = kernel.selectableOpenable
  const kernelOn = Boolean(kernel.id) && Boolean(selectable)
  const openTag = openable === true ? ' · 可打开'
    : openable === false ? ' · 当前用户打不开'
    : windows ? ' · 能否打开未知（COM 口独占，不试探）' : ''
  $('kernelDot').classList.toggle('on', kernelOn && openable !== false)
  $('kernelChip').classList.toggle('t-warn', kernelOn && openable === false)
  setText('kernelChipText', kernelOn ? ('内核 ' + selectable) : '内核级未启用')
  setText('kernelSelectable', kernelOn ? (selectable + openTag) : '未启用', kernelOn ? (openable === false ? 'warn' : 'ok') : 'warn')
  const kernelCell = $('kernelSelectable')
  if (kernelCell) kernelCell.title = kernel.title || ''

  // 桌面壳串口下拉只认 /dev/ttyUSBn，所以内核设备要额外挂一个别名
  setShown('rowKernelAlias', !windows)
  if (!windows) {
    if (kernel.desktopAlias) setText('kernelAlias', kernel.desktopAlias, 'ok')
    else setText('kernelAlias', kernelOn ? '无别名，下拉看不到' : '未启用', 'warn')
  }

  // ① PTY 设备
  const ptySupported = !windows && device.supported !== false
  if (!ptySupported) {
    setText('devPath', windows ? '本平台不提供（用 com0com）' : '本平台不提供')
  } else {
    setText('devPath', device.path || (device.available === false ? ('不可用：' + (device.reason || '未知原因')) : '未开启'))
  }
  const devCell = $('devPath')
  const links = Array.isArray(device.links) ? device.links.filter(Boolean) : []
  const warnings = Array.isArray(device.warnings) ? device.warnings.filter(Boolean) : []
  if (devCell) devCell.title = links.concat(warnings).join(' | ')

  // ② 桌面桥接 / ③ 浏览器注入
  setText('bridgeUrl', (state.bridgeUrl || ('ws://127.0.0.1:' + (state.bridgePort || 18765) + '/echo'))
    + ' · ' + bridgeClients + ' 个客户端')
  setText('injectCount', injectClients + ' 个页面')

  // 唯一的"要你动手"提示行：没事就不出现
  const fixes = []
  if (!windows && kernelOn && openable === false) fixes.push('内核设备打不开，执行一次：' + helperCommand)
  if (!windows && kernelOn && !kernel.desktopAlias) fixes.push('桌面下拉缺 /dev/ttyUSBn 别名，执行一次：' + helperCommand)
  if (!kernelOn) {
    const backends = Array.isArray(kernel.backends) ? kernel.backends : []
    const blocked = backends.filter(item => item && !item.available)
    if (windows) fixes.push('内核级未启用：装一次 com0com 即可得到可被直接选中的 COM 口')
    else if (blocked.length) fixes.push('内核级未启用：' + (blocked[0].install || blocked[0].reason || '缺前置条件'))
    else fixes.push('内核级未启用：浏览器串口选择框看不到 PTY，Web 模式请用「打开并预置虚拟串口」')
  }
  setShown('actionHint', fixes.length > 0)
  setText('actionHint', fixes.length ? fixes.join('　·　') : '--')

  // root 助手：只有 Linux 需要
  const helperNeeded = !windows && helper.required !== false
  setShown('rowHelper', helperNeeded && helper.installed !== true)
  setDisabled('btnInstallHelper', !helperNeeded || helper.installed === true)
  setText('helperState', helper.installed === true ? '已安装' : '装一次即可，之后不再输密码', helper.installed === true ? 'ok' : null)

  // 接入系统串口列表：只在"内核别名不存在而 PTY 存在"时才有意义
  const linkNeeded = ptySupported && device.linkNeeded !== false && !kernel.desktopAlias
  setShown('rowLink', linkNeeded)
  if (linkNeeded) {
    const linkNode = $('linkState')
    if (linkNode) linkNode.dataset.target = device.systemLink || '/dev/ttyUSB0'
    setText('linkState', device.systemLinked ? ('已接入 ' + device.systemLinked)
      : ('把 PTY 挂成 ' + (device.systemLink || '/dev/ttyUSB0') + '，桌面壳下拉才看得到（需一次系统授权）'))
    setDisabled('btnLink', !device.path)
    setDisabled('btnUnlink', !device.systemLinked)
  } else {
    setDisabled('btnLink', true)
    setDisabled('btnUnlink', true)
  }

  // 折叠里的通道说明：按平台给一份，不占正文
  setText('channelDoc', windows
    ? '⓿ com0com 成对 COM 口：浏览器串口选择框与桌面程序都能直接选中另一端。① PTY 是 Linux 专属，本平台没有。② 桌面桥接 ws://127.0.0.1:18765/echo：桌面模式下被测应用自己连过来，业务操作只需要这条。③ 浏览器注入：keysim 拉起浏览器并在页面脚本前替换 navigator.serial，免去手点串口选择框。'
    : '⓿ 内核级设备（USB/IP 等）是唯一能被浏览器串口选择框看到的通道，桌面壳下拉则认 /dev/ttyUSBn 别名。① PTY /dev/pts/N 是真字符设备，任何按路径开串口的程序（pyserial、minicom、cat）都能读，但内核不把它注册成 udev tty，所以浏览器选择框看不到。② 桌面桥接 ws://127.0.0.1:18765/echo：桌面模式下被测应用自己连过来，业务操作只需要这条。③ 浏览器注入：keysim 拉起浏览器并在页面脚本前替换 navigator.serial，免去手点串口选择框。')

  // 被测页面（浏览器注入）
  const browserBroken = browser.available === false
  setText('pageState', browser.open
    ? ('已打开 ' + (browser.url || '被测页面'))
    : (browserBroken ? ('不可用：' + (browser.reason || '本机没找到可用的 Chromium / Chrome')) : '未打开'),
    browserBroken ? 'warn' : null)
  setDisabled('btnOpenPage', browserBroken)
  setDisabled('btnClosePage', !browser.open)
  // 手动注入只在"内核级不可用"或"要用你自己已登录的浏览器"时才有意义
  setShown('rowManualInject', !kernelOn)
  setText('pageHint', kernelOn
    ? ('浏览器里也可以手动选 ' + selectable + '（要点一次串口选择框）；用这个按钮则免去手点，适合自动化。登录态留在 '
        + (browser.profile || '~/.keysim/browser-profile') + '，只需登录一次。')
    : '浏览器串口选择框看不到 PTY，Web 模式必须用这个按钮（keysim 会在页面脚本执行前替换 navigator.serial）。')

  // 拍发状态
  setDisabled('btnOpen', open)
  setDisabled('btnClose', !open)
  setDisabled('btnSend', !open || running)
  setDisabled('btnStop', !running)
  const total = Number(replay.total) || 0
  const sent = Number(replay.sent) || 0
  $('progress').style.width = (total > 0 ? Math.min(100, Math.round(sent / total * 100)) : 0) + '%'
}
// ==== state-render:end ====

const events = new EventSource('/api/events')
events.onmessage = message => {
  const event = JSON.parse(message.data)
  if (event.type === 'state') applyState(event.state)
  else if (event.type === 'log') log(event.message, event.level)
  else if (event.type === 'progress') {
    const total = Number(event.total) || 0
    $('progress').style.width = (total > 0 ? Math.min(100, Math.round((Number(event.sent) || 0) / total * 100)) : 0) + '%'
  }
}
events.onerror = () => log('事件流断开，正在重连…', 'warn')

$('key').onchange = () => {
  const hand = $('key').value === 'hand'
  $('rateUnit').textContent = hand ? '字符/分' : '组/分'
  $('rate').value = hand ? 70 : 20
  $('tail').value = hand ? 'turn' : 'page'
}
$('btnOpen').onclick = async () => {
  const result = await api('/api/port', {open: true})
  if (result.ok) applyState(result.state); else log(result.error, 'error')
}
$('btnClose').onclick = async () => {
  const result = await api('/api/port', {open: false})
  if (result.ok) applyState(result.state); else log(result.error, 'error')
}
$('btnRandom').onclick = async () => {
  const result = await api('/api/message/random', {alphabet: $('alphabet').value, groups: Number($('groups').value)})
  if (!result.ok) return log(result.error, 'error')
  $('message').value = result.text
  log('已生成随机报文：' + result.text, 'ok')
}
$('btnPreview').onclick = async () => {
  const result = await api('/api/preview', params())
  if (!result.ok) return log(result.error, 'error')
  $('stDuration').textContent = (result.duration / 1000).toFixed(2) + ' s'
  $('stEvents').textContent = result.events + ' 帧 / ' + result.chars + ' 字'
  const plan = result.plan || {}
  $('stPlan').textContent = plan.dot
    ? [plan.dot, plan.dash, plan.gap].map(value => Math.round(value) + 'ms').join(' / ')
    : (plan.perChar ? Math.round(plan.perChar) + 'ms/字' : '--')
  $('stGap').textContent = plan.word ? Math.round(plan.word) + 'ms / ' + Math.round(plan.group) + 'ms' : '--'
  log('前 12 个串口读：' + result.head.join(' | '), 'recv')
}
$('btnSend').onclick = async () => {
  const result = await api('/api/send', params())
  if (!result.ok) return log(result.error, 'error')
  applyState(result.state)
}
$('btnStop').onclick = async () => {
  const result = await api('/api/stop')
  if (result.ok) applyState(result.state)
}
$('btnInstallHelper').onclick = async () => {
  log('正在安装 root 助手…', 'info')
  const result = await api('/api/helper/install', {})
  if (!result.ok && result.command) log('请手动执行一次：' + result.command, 'warn')
  if (result.state) applyState(result.state)
  await refresh()
}
// 反馈必须落在按钮旁边：日志面板在页面最下面，点完看不见就像没反应
const linkFeedback = (result, success) => {
  if (result.ok) {
    setText('linkState', success, 'ok')
    log(success, 'ok')
  } else {
    const reason = result.error || '操作失败'
    const hint = result.hint ? ('；手动执行：' + result.hint) : ''
    setText('linkState', reason + hint, 'warn')
    log(reason + hint, 'warn')
  }
  if (result.state) applyState(result.state)
}
$('btnLink').onclick = async () => {
  setText('linkState', '正在接入…')
  const target = ($('linkState').dataset.target) || '/dev/ttyUSB0'
  linkFeedback(await api('/api/device/link', {}), '已接入系统串口列表 ' + target)
}
$('btnUnlink').onclick = async () => {
  setText('linkState', '正在移出…')
  linkFeedback(await api('/api/device/link', {remove: true}), '已移出系统串口列表')
}
$('btnOpenPage').onclick = async () => {
  const url = $('targetUrl').value.trim()
  if (!url) return log('先填被测页面地址', 'warn')
  const result = await api('/api/browser/open', {url})
  if (!result.ok) return log(result.error, 'error')
  await refresh()
}
$('btnClosePage').onclick = async () => {
  await api('/api/browser/close', {})
  await refresh()
}
$('btnCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('injectSnippet').value)
    log('注入代码已复制', 'ok')
  } catch { log('剪贴板不可用，请手动复制输入框内容', 'warn') }
}

$('injectSnippet').value = `fetch('${location.origin}/inject.js').then(r=>r.text()).then(eval)`
const refresh = async () => {
  const result = await api('/api/state', {}, 'GET')
  const state = (result && result.state) || {}
  applyState(state)
  return state
}
refresh().then(state => {
  log('控制台就绪：' + location.origin + (state.open ? '，虚拟串口已自动开启' : ''), 'ok')
})
</script>
</body>
</html>
