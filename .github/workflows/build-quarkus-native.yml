name: Build Quarkus Native

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (JVM, Testcontainers)
    runs-on: ubuntu-22.04
    # 后端已移入 backend/；working-directory 只作用于 run 步骤，
    # 不影响 uses 动作的输入路径（见下方 upload-artifact 的 path）。
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      # 测试套件依赖 Testcontainers 起 Linux MySQL 容器，只能在 Linux runner 跑；
      # native 矩阵（含 Windows）一律 -DskipTests，测试由本 job 统一守门
      - name: Run tests
        run: mvn -B verify


  frontend:
    name: Frontend (npm ci, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bw-frontend/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bw-frontend/frontend/package-lock.json
      # 发布校验契约测试（Git fixture，不依赖网络/npm）。桌面包本体只在 tag 上构建，
      # PR/push 由这一步守门：tag 与三个版本号的一致性、产物目录集合、桌面包
      # 内嵌后端二进制的一致性全部在这里可观察。
      - name: Test release verification contracts
        working-directory: bw-frontend
        run: node --test 'scripts/test/*.test.mjs'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test question import contracts
        run: npm run test:question-import
      - name: Build frontend
        run: npm run build
      - name: Package deployable Web artifact
        run: node ../scripts/artifact-manifest.cjs package-web output/artifacts
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: bw-frontend/frontend/output/artifacts/*
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            runner: ubuntu-22.04
            native_march: x86-64
            asset_suffix: linux-amd64
          - os: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            native_march: armv8-a
            asset_suffix: linux-arm64
          - os: windows-2022
            arch: x86_64
            runner: windows-2022
            asset_suffix: windows-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for artifact manifests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up GraalVM (Java 21 with Native Image)
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: Build Native Binary
        if: matrix.os == 'windows-2022'
        run: mvn -B -Pnative -DskipTests package

      - name: Build Native Binary (Linux glibc 2.28 baseline)
        if: startsWith(matrix.os, 'ubuntu')
        run: mvn -B -Pnative -DskipTests -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 -Dquarkus.native.march=${{ matrix.native_march }} package

      - name: Verify glibc baseline (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find target -maxdepth 1 -name '*-runner' -type f | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No Linux native runner found in target/"
            exit 1
          fi
          MAX_VER=$(strings -a "$FILE" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n 1 || true)
          if [ -z "${MAX_VER}" ]; then
            echo "No GLIBC version symbols found, assuming OK"
            exit 0
          fi
          REQ="2.28"
          TOP=$(printf '%s\n' "$REQ" "$MAX_VER" | sort -V | tail -n 1)
          if [ "$TOP" != "$REQ" ]; then
            echo "glibc requirement too high: ${MAX_VER} (> ${REQ})"
            exit 1
          fi
          echo "glibc baseline OK: ${MAX_VER} <= ${REQ}"

      # native 制品此前从未做过功能冒烟，只验证过「能编译 + glibc 基线」。
      # 这里启动真实 runner 并请求一个只读端点，证明 native 镜像可启动并提供 HTTP 服务。
      # 绕开 DB 的方式（三选一里选「不起 MySQL」）：%prod 默认
      # hibernate-orm.database.generation=validate 会在启动时连库校验 schema，
      # 这里覆盖为 none，并把连接池 min-size 归零避免后台预热连接刷错误日志；
      # 请求 /q/openapi —— smallrye-openapi 在 prod 模式同样注册该端点，且不查库。
      # 选它而不是加 MySQL service container 的原因：service container 只在 Linux
      # runner 可用，而本矩阵含 windows-2022，job 级 services 会让 Windows 分支直接失败。
      - name: Smoke test native runner
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(find target -maxdepth 1 -type f \( -name '*-runner' -o -name '*-runner.exe' \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "No native runner found in target/"
            exit 1
          fi
          chmod +x "$BIN" || true
          "$BIN" -Dquarkus.hibernate-orm.database.generation=none \
                 -Dquarkus.datasource.jdbc.min-size=0 \
                 -Dquarkus.http.port=18001 > target/native-smoke.log 2>&1 &
          PID=$!
          status=1
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18001/q/openapi; then
              status=0
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "native runner exited before answering"
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo '----- native runner log -----'
          cat target/native-smoke.log || true
          if [ "$status" -ne 0 ]; then
            echo 'Smoke test failed: /q/openapi did not return 200'
            exit 1
          fi
          echo 'Smoke test OK: native runner served /q/openapi'

      # -D 参数必须整体加引号：Windows 分支默认 shell 是 pwsh，不加引号时
      # `-Dexpression=project.version` 会被拆成 `-Dexpression=project` + `.version`，
      # 后者被 Maven 当作生命周期阶段 → `Unknown lifecycle phase ".version"`
      # （2026-09-10 run 34473213093 windows-2022 即因此失败；Linux/bash 分支不受影响）。
      - name: Resolve native artifact version
        run: mvn -B help:evaluate "-Dexpression=project.version" -q -DforceStdout "-Doutput=target/build-version.txt"

      - name: Package native binary and manifest
        run: node ../bw-frontend/scripts/artifact-manifest.cjs native ${{ matrix.asset_suffix }}

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-native-${{ matrix.asset_suffix }}
          path: backend/target/artifact-${{ matrix.asset_suffix }}/*
          if-no-files-found: error

  desktop:
    name: Desktop package (linux --dir)
    # 只在 tag 上跑：一次完整 vite build + 下载 electron 运行时 + ~300MB 未打包产物，
    # 每次 push 都构建代价过大；PR/push 的守门放在 frontend job 的契约测试里。
    if: startsWith(github.ref, 'refs/tags/')
    # 必须等 build：桌面包内的后端二进制取自本次 native 产物，不是打包者本机状态。
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 桌面工具链（electron-builder 22.14.13）是 2021 年的版本，固定在 Node 20 LTS；
      # Web 链路继续用 24。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bw-frontend/package-lock.json
            bw-frontend/frontend/package-lock.json

      - name: Download Linux amd64 native artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-linux-amd64
          path: ${{ runner.temp }}/native-linux-amd64

      # package.json 的 extraFiles 只声明 ./bin，而 electron/service/index.js:27 按
      # `<appPath>/bin/server/server` 启动后端 —— 本地打包时这份二进制是打包者手工放的
      # （DELIVERY-04 抱怨的「取自打包者本机状态」）。这里从已校验的 native 产物 staging：
      # bin/server/ 已在 bw-frontend/.gitignore（native 二进制超 GitHub 单文件上限），
      # 因此写进工作树不会让 git status 变脏 —— bin/ 的内容恰好是「tag 的 git 树 +
      # 本次 native 产物」，这就是 extraFiles 需要的干净 staging 目录，无需改 package.json。
      - name: Stage released backend binary into bin/server/server
        env:
          NATIVE_INPUT: ${{ runner.temp }}/native-linux-amd64
        run: |
          set -euo pipefail
          shopt -s nullglob
          runners=("$NATIVE_INPUT"/quarkus-*-linux-amd64)
          if [ "${#runners[@]}" -ne 1 ]; then
            echo "Expected exactly one native runner in $NATIVE_INPUT, found ${#runners[@]}"
            exit 1
          fi
          mkdir -p bw-frontend/bin/server
          cp "${runners[0]}" bw-frontend/bin/server/server
          chmod +x bw-frontend/bin/server/server

      # 不能加 --ignore-scripts：electron 的 postinstall 才会把运行时解到
      # node_modules/electron/dist，下一步的 --config.electronDist 就指向它。
      - name: Install desktop dependencies
        working-directory: bw-frontend
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: bw-frontend/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      # --dir 只出未打包目录：deb/nsis 需要 fpm、中文 productName 的资产名规范化与
      # /opt 权限处理，本轮明确不做（Spec §1.2）。前端由 beforePack 钩子自行构建。
      # electronDist 复用 npm ci 已解出的运行时，省掉 electron-builder 的二次下载；
      # 这条命令与 docs/plans/2026-09-10-customer-issue-fix-plan.md:178 记录的本地成功调用一致。
      - name: Build unpacked desktop package
        working-directory: bw-frontend
        run: npm run build-e-l -- --dir --config.electronDist=node_modules/electron/dist

      # 先按 backend 契约校验下载来的 native 产物，再逐字节确认包内 bin/server/server
      # 就是它，然后产出桌面 manifest（含 SHA 清单与后端来源 SHA）与 zip。
      - name: Package desktop artifact and manifest
        env:
          NATIVE_INPUT: ${{ runner.temp }}/native-linux-amd64
          DESKTOP_OUTPUT: ${{ runner.temp }}/desktop-artifacts
        run: node bw-frontend/scripts/artifact-manifest.cjs package-desktop "$NATIVE_INPUT" "$DESKTOP_OUTPUT"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/desktop-artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [frontend, build, test, desktop]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ runner.temp }}/release-input/frontend
      - name: Download Linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-linux-amd64
          path: ${{ runner.temp }}/release-input/linux-amd64
      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-linux-arm64
          path: ${{ runner.temp }}/release-input/linux-arm64
      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-windows-amd64
          path: ${{ runner.temp }}/release-input/windows-amd64
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/release-input/desktop-linux
      # RELEASE_REF 让校验器断言 tag 版本 == backend/pom.xml == frontend/package.json
      # == bw-frontend/package.json；三者互不相干，只比一个就会放出
      # 「v1.1.0 的 tag 挂 3.1.0 桌面包」的发布。
      - name: Verify complete clean-source release set
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_INPUT: ${{ runner.temp }}/release-input
          RELEASE_OUTPUT: ${{ runner.temp }}/release-assets
        run: node bw-frontend/scripts/artifact-manifest.cjs release "$RELEASE_INPUT" "$RELEASE_OUTPUT" "$EXPECTED_COMMIT" "$RELEASE_REF"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
