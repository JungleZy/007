version: 1.1.0
nip:
  security:
    password:
      iterations: 600000
quarkus:
  analytics:
    disabled: true
  banner:
    path: banner.txt
    enabled: false
  http:
    host: 0.0.0.0
    port: 18001
    limits:
      # 10 MiB 文件 + multipart 边界与表单字段；文件本身由解析端点限制到 10 MiB。
      max-body-size: 11M
    cors:
      ~: true
      headers: '*'
      origins: '*'
      methods: OPTIONS, GET, POST, DELETE, PUT, PATCH
  datasource:
    db-kind: mysql
    jdbc:
      # 池上限与 MySQL 默认 max_connections=151 对齐：原 200 单实例就能顶满整库连接数。
      # 50 条留出多实例部署与运维会话的余量（50 × 3 实例 + 运维 < 151）。
      max-size: 50
      min-size: 20
  hibernate-orm:
    jdbc:
      statement-batch-size: 100
      statement-fetch-size: 50
    log:
      sql: false
    database:
      generation: none
    physical-naming-strategy: com.nip.common.utils.CustomPhysicalNamingStrategy
  ssl:
    native: false
  swagger-ui:
    enable: true
    theme: newspaper
  websocket:
    dispatch-to-worker: true
  log:
    level: INFO
    file:
      path: ./logs/info.log
      enable: true
      level: WARN
      format: '%d{yyyy-MM-dd HH:mm:ss,SSS}  %h %N[%i] %-5p [%c{3.}] (%t) %s%e%n %l %F'
      rotation: # 新增日志轮转
        max-file-size: 10M
        max-backup-index: 10
    console:
      level: INFO
      enable: true
      stderr: true
  native:
    resources:
      includes: resources/**
    march: compatibility
#    additional-build-args: -H:ReflectionConfigurationFiles=reflection-config.json
"%dev":
  quarkus:
    datasource:
      username: root
      password: root
      jdbc:
        url: jdbc:mysql://localhost:3306/project006?rewriteBatchedStatements=true&characterEncoding=utf8&useSSL=true&allowPublicKeyRetrieval=true
        # 原 URL 尾部的 idleTimeout/connectionTestQuery 是 HikariCP 专有参数，
        # 本项目连接池是 Agroal，这两个参数在 URL 里既不被驱动识别也不被池识别，等于没配。
        # 下面三项是 Agroal 等价配置：空闲连接 1 分钟回收 + 每 2 分钟后台校验存活连接。
        idle-removal-interval: 1M
        background-validation-interval: 2M
        validation-query-sql: SELECT 1
"%test":
  quarkus:
    datasource:
      devservices:
        enabled: true
        image-name: mysql:8.0
        db-name: project006_test
    hibernate-orm:
      database:
        generation: drop-and-create
    http:
      test-port: 18081
    scheduler:
      # 测试期关掉 @Scheduled 自动触发：GeneralSettlementRecovery 与
      # PostTelexPatTrainRecovery 都挂在 every=5s 上，会全库扫描并结算越出当前用例的训练行，
      # 让评分断言随执行时机漂移。恢复路径本身由各用例显式调用 settleExpired(...) 驱动。
      enabled: false
"%prod":
  quarkus:
    datasource:
      # 凭据只从部署环境注入：仓库内不留明文口令，且刻意不写 ${DB_USER:root} 这类默认值——
      # 带默认值等于没改。Quarkus 对未展开的 ${DB_USER} 不报错而是当作「未配置」，
      # MySQL 驱动会回退到操作系统用户名连库、进程照常对外提供 HTTP，
      # 所以缺变量必须由 com.nip.common.ProdDatasourceCredentialsValidator 在启动期直接失败。
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      jdbc:
        url: jdbc:mysql://localhost:3306/project006?rewriteBatchedStatements=true&characterEncoding=utf8&useSSL=true&allowPublicKeyRetrieval=true
        # 同 %dev：HikariCP 专有的 idleTimeout/connectionTestQuery 从 URL 移除，
        # 改用 Agroal 的空闲回收与后台校验配置。
        idle-removal-interval: 1M
        background-validation-interval: 2M
        validation-query-sql: SELECT 1
    hibernate-orm:
      database:
        # 顺序硬约束：必须先执行 backend/database/migrations/2026-08-26-01-schema-sync.sql
        # 与 02-engine-innodb.sql，再部署本配置，否则启动即失败。
        # 已于 2026-08-28 在 current+base 双快照库演练通过（迁移 01→02 → %prod
        # generation:validate 启动零校验错误；证据 <仓库根>/docs/reviews/archive/2026-08-28-migration-rehearsal.md）。
        generation: validate
