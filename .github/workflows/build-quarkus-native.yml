name: Build Quarkus Native

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (JVM, Testcontainers)
    runs-on: ubuntu-22.04
    # 后端已移入 backend/；working-directory 只作用于 run 步骤，
    # 不影响 uses 动作的输入路径（见下方 upload-artifact 的 path）。
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      # 测试套件依赖 Testcontainers 起 Linux MySQL 容器，只能在 Linux runner 跑；
      # native 矩阵（含 Windows）一律 -DskipTests，测试由本 job 统一守门
      - name: Run tests
        run: mvn -B verify


  frontend:
    name: Frontend (npm ci, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bw-frontend/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bw-frontend/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test question import contracts
        run: npm run test:question-import
      - name: Build frontend
        run: npm run build
      - name: Package deployable Web artifact
        run: node ../scripts/artifact-manifest.cjs package-web output/artifacts
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: bw-frontend/frontend/output/artifacts/*
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            runner: ubuntu-22.04
            native_march: x86-64
            asset_suffix: linux-amd64
          - os: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            native_march: armv8-a
            asset_suffix: linux-arm64
          - os: windows-2022
            arch: x86_64
            runner: windows-2022
            asset_suffix: windows-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for artifact manifests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up GraalVM (Java 21 with Native Image)
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: Build Native Binary
        if: matrix.os == 'windows-2022'
        run: mvn -B -Pnative -DskipTests package

      - name: Build Native Binary (Linux glibc 2.28 baseline)
        if: startsWith(matrix.os, 'ubuntu')
        run: mvn -B -Pnative -DskipTests -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 -Dquarkus.native.march=${{ matrix.native_march }} package

      - name: Verify glibc baseline (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find target -maxdepth 1 -name '*-runner' -type f | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No Linux native runner found in target/"
            exit 1
          fi
          MAX_VER=$(strings -a "$FILE" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n 1 || true)
          if [ -z "${MAX_VER}" ]; then
            echo "No GLIBC version symbols found, assuming OK"
            exit 0
          fi
          REQ="2.28"
          TOP=$(printf '%s\n' "$REQ" "$MAX_VER" | sort -V | tail -n 1)
          if [ "$TOP" != "$REQ" ]; then
            echo "glibc requirement too high: ${MAX_VER} (> ${REQ})"
            exit 1
          fi
          echo "glibc baseline OK: ${MAX_VER} <= ${REQ}"

      # native 制品此前从未做过功能冒烟，只验证过「能编译 + glibc 基线」。
      # 这里启动真实 runner 并请求一个只读端点，证明 native 镜像可启动并提供 HTTP 服务。
      # 绕开 DB 的方式（三选一里选「不起 MySQL」）：%prod 默认
      # hibernate-orm.database.generation=validate 会在启动时连库校验 schema，
      # 这里覆盖为 none，并把连接池 min-size 归零避免后台预热连接刷错误日志；
      # 请求 /q/openapi —— smallrye-openapi 在 prod 模式同样注册该端点，且不查库。
      # 选它而不是加 MySQL service container 的原因：service container 只在 Linux
      # runner 可用，而本矩阵含 windows-2022，job 级 services 会让 Windows 分支直接失败。
      - name: Smoke test native runner
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(find target -maxdepth 1 -type f \( -name '*-runner' -o -name '*-runner.exe' \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "No native runner found in target/"
            exit 1
          fi
          chmod +x "$BIN" || true
          "$BIN" -Dquarkus.hibernate-orm.database.generation=none \
                 -Dquarkus.datasource.jdbc.min-size=0 \
                 -Dquarkus.http.port=18001 > target/native-smoke.log 2>&1 &
          PID=$!
          status=1
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18001/q/openapi; then
              status=0
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "native runner exited before answering"
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo '----- native runner log -----'
          cat target/native-smoke.log || true
          if [ "$status" -ne 0 ]; then
            echo 'Smoke test failed: /q/openapi did not return 200'
            exit 1
          fi
          echo 'Smoke test OK: native runner served /q/openapi'

      # -D 参数必须整体加引号：Windows 分支默认 shell 是 pwsh，不加引号时
      # `-Dexpression=project.version` 会被拆成 `-Dexpression=project` + `.version`，
      # 后者被 Maven 当作生命周期阶段 → `Unknown lifecycle phase ".version"`
      # （2026-09-10 run 34473213093 windows-2022 即因此失败；Linux/bash 分支不受影响）。
      - name: Resolve native artifact version
        run: mvn -B help:evaluate "-Dexpression=project.version" -q -DforceStdout "-Doutput=target/build-version.txt"

      - name: Package native binary and manifest
        run: node ../bw-frontend/scripts/artifact-manifest.cjs native ${{ matrix.asset_suffix }}

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-native-${{ matrix.asset_suffix }}
          path: backend/target/artifact-${{ matrix.asset_suffix }}/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [frontend, build, test]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ runner.temp }}/release-input/frontend
      - name: Download Linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-linux-amd64
          path: ${{ runner.temp }}/release-input/linux-amd64
      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-linux-arm64
          path: ${{ runner.temp }}/release-input/linux-arm64
      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-native-windows-amd64
          path: ${{ runner.temp }}/release-input/windows-amd64
      - name: Verify complete clean-source release set
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_INPUT: ${{ runner.temp }}/release-input
          RELEASE_OUTPUT: ${{ runner.temp }}/release-assets
        run: node bw-frontend/scripts/artifact-manifest.cjs release "$RELEASE_INPUT" "$RELEASE_OUTPUT" "$EXPECTED_COMMIT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
