name: Rust Backend

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  rust-backend:
    name: Rust backend (test, build, smoke)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust backend
        run: cargo test --locked

      - name: Build Rust backend (debug)
        run: cargo build --locked
      - name: Build Rust backend (release)
        run: cargo build --locked --release
      - name: Smoke test release Rust backend binary
        run: ./scripts/smoke.sh target/release/rust-backend
      - name: Upload Rust release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-backend-linux-amd64
          path: backend-rust/target/release/rust-backend
          if-no-files-found: error
