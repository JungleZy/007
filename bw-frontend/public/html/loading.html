<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<style>
      html, body {
          background: transparent;
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
      }

      .layout-center {
          display: flex;
          flex-wrap: wrap;
          flex-direction: row;
          justify-content: center;
          align-items: center;
      }

      .content {
          width: 410px;
          height: 300px;
      }

      .loading {
          position: absolute;
          /* 居中 */
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          /* 高度 */
          height: 40px;
          /* 弹性布局 */
          display: flex;
          /* 设置子项在y轴方向居中，应该是设置起点在中间，非常有用，不然动画很怪 */
          align-items: center;
      }

      /* 小竖条 */
      .item {
          height: 50px;
          width: 5px;
          background: #34d518;
          /* 加margin，使竖条之间有空隙 */
          margin: 0 3px;
          /* 圆角 */
          border-radius: 10px;
          /* 动画：名称、时间、循环 */
          animation: loading 1s infinite;
      }

      /* 设置动画 */
      @keyframes loading {
          0% {
              height: 0;
          }

          50% {
              height: 50px;
          }

          100% {
              height: 0;
          }
      }

      /* 为每一个竖条设置延时 */
      .item:nth-child(2) {
          animation-delay: 0.1s;
      }

      .item:nth-child(3) {
          animation-delay: 0.2s;
      }

      .item:nth-child(4) {
          animation-delay: 0.3s;
      }

      .item:nth-child(5) {
          animation-delay: 0.4s;
      }

      .item:nth-child(6) {
          animation-delay: 0.5s;
      }

      .item:nth-child(7) {
          animation-delay: 0.6s;
      }

      .item:nth-child(8) {
          animation-delay: 0.7s;
      }
      .tips{
          padding-top: 80px;
		      color: #34d518;
      }
	</style>
</head>
<body class="layout-center">
<div class="content layout-center">
	<div class="loading">
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
		<div class="item"></div>
	</div>
	<div class="tips">系统加载中</div>
</div>
</body>
</html>
