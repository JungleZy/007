[workspace]
members = ["crates/app", "crates/persistence"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
rust_decimal = "1"
base64 = "0.22"
md-5 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
subtle = "2"
sea-orm = { version = "1.1.14", default-features = false, features = ["macros", "sqlx-mysql", "runtime-tokio-rustls", "with-chrono", "with-rust_decimal"] }
