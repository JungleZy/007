name: Build Quarkus Native

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (JVM, Testcontainers)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 测试套件依赖 Testcontainers 起 Linux MySQL 容器，只能在 Linux runner 跑；
      # native 矩阵（含 Windows）一律 -DskipTests，测试由本 job 统一守门
      - name: Run tests
        run: mvn -B verify

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            runner: ubuntu-22.04
            native_march: x86-64
            asset_suffix: linux-amd64
          - os: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            native_march: armv8-a
            asset_suffix: linux-arm64
          - os: windows-2022
            arch: x86_64
            runner: windows-2022
            asset_suffix: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 21 with Native Image)
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '21'
          components: native-image

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Native Binary
        if: matrix.os == 'windows-2022'
        run: mvn -B -Pnative -DskipTests package

      - name: Build Native Binary (Linux glibc 2.28 baseline)
        if: startsWith(matrix.os, 'ubuntu')
        run: mvn -B -Pnative -DskipTests -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 -Dquarkus.native.march=${{ matrix.native_march }} package

      - name: Verify glibc baseline (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find target -maxdepth 1 -name '*-runner' -type f | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No Linux native runner found in target/"
            exit 1
          fi
          MAX_VER=$(strings -a "$FILE" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n 1 || true)
          if [ -z "${MAX_VER}" ]; then
            echo "No GLIBC version symbols found, assuming OK"
            exit 0
          fi
          REQ="2.28"
          TOP=$(printf '%s\n' "$REQ" "$MAX_VER" | sort -V | tail -n 1)
          if [ "$TOP" != "$REQ" ]; then
            echo "glibc requirement too high: ${MAX_VER} (> ${REQ})"
            exit 1
          fi
          echo "glibc baseline OK: ${MAX_VER} <= ${REQ}"

      - name: Rename binary with architecture suffix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          renamed=0
          for f in target/*-runner; do
            mv "$f" "${f}-${{ matrix.asset_suffix }}"
            renamed=1
          done
          for f in target/*-runner.exe; do
            mv "$f" "${f%.exe}-${{ matrix.asset_suffix }}.exe"
            renamed=1
          done
          if [ "$renamed" -eq 0 ]; then
            echo "No runner binary found to rename"
            exit 1
          fi

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-native-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/*-runner*
            target/*-runner.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, test]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
