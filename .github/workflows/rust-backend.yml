name: Rust Backend

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  rust-backend:
    name: Rust backend (test, build, smoke)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Rust backend
        run: cargo test --locked

      - name: Build Rust backend
        run: cargo build --locked

      - name: Smoke test real Rust backend binary
        run: ./scripts/smoke.sh target/debug/rust-backend
